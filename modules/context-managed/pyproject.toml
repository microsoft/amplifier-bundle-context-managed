[project]
name = "amplifier-module-context-managed"
version = "0.1.0"
description = "Context manager with LLM-powered rolling summaries and persistent transcript"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "bkrabach" },
]
dependencies = [
    "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main",
]

[project.entry-points."amplifier.modules"]
context-managed = "amplifier_module_context_managed:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_context_managed",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }

[dependency-groups]
dev = ["amplifier-core", "pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
