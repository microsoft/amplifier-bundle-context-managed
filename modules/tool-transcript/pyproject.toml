[project]
name = "amplifier-module-tool-transcript"
version = "0.1.0"
description = "Transcript retrieval tool for context-managed bundle"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "bkrabach" },
]
dependencies = []

[project.entry-points."amplifier.modules"]
tool-transcript = "amplifier_module_tool_transcript:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_tool_transcript",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }
amplifier-module-context-managed = { path = "../context-managed", editable = true }

[dependency-groups]
dev = ["amplifier-core", "amplifier-module-context-managed", "pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
