name: Component tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    name: Python ${{ matrix.python }} / Core 2.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Test the exact PR head, not an implicit synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record source
        run: |
          mkdir -p component-evidence
          git rev-parse HEAD HEAD^{tree} | tee component-evidence/source.txt
          python --version 2>&1 | tee component-evidence/python.txt
      - name: Install component test profile
        run: |
          set -o pipefail
          # Keep project dependency declarations intact (including context-simple).
          # Its resolved commit and every installed version are recorded below.
          python -m pip install \
            'amplifier-core==2.0.2' 'pytest==8.4.2' \
            'pytest-asyncio==1.2.0' 'PyYAML==6.0.3' \
            ./modules/context-managed ./modules/tool-transcript \
            2>&1 | tee component-evidence/install.log
          python -m pip freeze --all | tee component-evidence/freeze.txt
          python -m pip check | tee component-evidence/pip-check.txt
      - name: Check CI evidence harness
        run: python -m unittest discover -s .github/scripts -p 'test_component_ci.py' -v
      - name: Run maintained component suites
        run: python .github/scripts/component_ci.py
      - name: Publish component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-python-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: component-evidence/
          if-no-files-found: error
          retention-days: 30